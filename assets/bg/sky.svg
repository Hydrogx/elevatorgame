<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 天空：从晴蓝慢慢过渡到奶油粉，靠近地平线更暖 -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FD1FF"/>
      <stop offset="0.35" stop-color="#B6E6FF"/>
      <stop offset="0.68" stop-color="#FFE3F0"/>
      <stop offset="1" stop-color="#FFF7E6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#sky)"/>
</svg>
