<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 2F 冰淇淋屋 场景 -->
  <defs>
    <linearGradient id="iceWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAFBF5"/>
      <stop offset="1" stop-color="#CFF2E6"/>
    </linearGradient>
    <linearGradient id="iceSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8E3FF"/>
      <stop offset="1" stop-color="#F0FBFF"/>
    </linearGradient>
    <pattern id="iceFloor" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#EAF6FF"/>
      <rect width="60" height="60" fill="#D6EDFF"/>
      <rect x="60" y="60" width="60" height="60" fill="#D6EDFF"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#iceWall)"/>
  <!-- 墙面小圆点 -->
  <g fill="#FFFFFF" opacity="0.75">
    <circle cx="120" cy="240" r="9"/><circle cx="220" cy="300" r="7"/><circle cx="330" cy="230" r="8"/>
    <circle cx="470" cy="310" r="7"/><circle cx="600" cy="250" r="9"/><circle cx="740" cy="320" r="7"/>
    <circle cx="880" cy="240" r="8"/><circle cx="1010" cy="300" r="7"/><circle cx="1120" cy="250" r="9"/>
  </g>

  <!-- 条纹雨篷 -->
  <g>
    <path d="M0 104 H1200 V186 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 q-50 34 -100 0 Z"
          fill="#FFFFFF" stroke="#6B4A45" stroke-width="8" stroke-linejoin="round"/>
    <g fill="#7FD8BE" opacity="0.85">
      <rect x="0" y="112" width="100" height="72"/>
      <rect x="200" y="112" width="100" height="72"/>
      <rect x="400" y="112" width="100" height="72"/>
      <rect x="600" y="112" width="100" height="72"/>
      <rect x="800" y="112" width="100" height="72"/>
      <rect x="1000" y="112" width="100" height="72"/>
      <rect x="1200" y="112" width="0" height="72"/>
    </g>
    <path d="M0 104 H1200" stroke="#6B4A45" stroke-width="8"/>
  </g>

  <!-- 护墙板与地板 -->
  <rect x="0" y="520" width="1200" height="155" fill="#BFEBDC"/>
  <rect x="0" y="508" width="1200" height="20" rx="10" fill="#9FE0CB" stroke="#6B4A45" stroke-width="5"/>
  <rect x="0" y="612" width="1200" height="63" fill="url(#iceFloor)"/>
  <rect x="0" y="606" width="1200" height="12" fill="#B9D9EA"/>

  <!-- 左侧菜单板 -->
  <rect x="120" y="230" width="300" height="230" rx="20" fill="#FFF6E5" stroke="#6B4A45" stroke-width="9"/>
  <path d="M150 250 H390" stroke="#F2B880" stroke-width="6"/>
  <g stroke="#C8B39B" stroke-width="8" stroke-linecap="round">
    <path d="M160 292 h180"/>
    <path d="M160 330 h140"/>
    <path d="M160 368 h200"/>
    <path d="M160 406 h120"/>
  </g>
  <circle cx="372" cy="292" r="12" fill="#FF8FAB"/>
  <circle cx="332" cy="330" r="12" fill="#7FD8BE"/>
  <circle cx="120" cy="230" r="0" fill="none"/>

  <!-- 右侧冰淇淋灯箱 -->
  <rect x="880" y="240" width="230" height="230" rx="24" fill="#FFF6E5" stroke="#6B4A45" stroke-width="9"/>
  <path d="M995 300 q40 0 40 -34 q0 -26 -40 -26 q-40 0 -40 26 q0 34 40 34 Z" fill="#FFD1E0" stroke="#6B4A45" stroke-width="7"/>
  <path d="M955 300 l40 68 l40 -68 Z" fill="#F2B880" stroke="#6B4A45" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="995" cy="272" r="12" fill="#FF5D8F" stroke="#6B4A45" stroke-width="5"/>
  <g stroke="#FFE066" stroke-width="8" stroke-linecap="round">
    <path d="M900 300 v110"/>
    <path d="M920 300 v110"/>
  </g>
  <g stroke="#7FD8BE" stroke-width="8" stroke-linecap="round">
    <path d="M1070 300 v110"/>
    <path d="M1090 300 v110"/>
  </g>

  <!-- 中央展示台（冰淇淋叠在这上面） -->
  <g stroke="#6B4A45" stroke-width="8" stroke-linejoin="round">
    <ellipse cx="620" cy="560" rx="150" ry="34" fill="#FFFFFF"/>
    <rect x="600" y="470" width="40" height="90" fill="#FFE6C9"/>
    <ellipse cx="620" cy="470" rx="120" ry="26" fill="#FFF6E5"/>
  </g>

  <!-- 柜台 -->
  <g stroke="#6B4A45" stroke-width="8" stroke-linejoin="round">
    <rect x="40" y="470" width="400" height="150" rx="22" fill="#FFFFFF"/>
    <rect x="760" y="470" width="400" height="150" rx="22" fill="#FFFFFF"/>
    <rect x="40" y="470" width="400" height="30" rx="15" fill="#FFD1E0"/>
    <rect x="760" y="470" width="400" height="30" rx="15" fill="#FFD1E0"/>
  </g>
  <g fill="#BFEBDC" stroke="#6B4A45" stroke-width="6">
    <rect x="80" y="520" width="120" height="80" rx="14"/>
    <rect x="230" y="520" width="120" height="80" rx="14"/>
    <rect x="820" y="520" width="120" height="80" rx="14"/>
    <rect x="970" y="520" width="120" height="80" rx="14"/>
  </g>
</svg>
