<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <!-- 5F 宠物层 场景 -->
  <defs>
    <linearGradient id="petWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2FBF6"/>
      <stop offset="1" stop-color="#DCF3E8"/>
    </linearGradient>
    <linearGradient id="petSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE7FF"/>
      <stop offset="1" stop-color="#EAF9FF"/>
    </linearGradient>
    <pattern id="petFloor" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#F2E4D2"/>
      <rect width="120" height="10" fill="#E3D0B8"/>
      <rect width="10" height="120" fill="#E3D0B8"/>
    </pattern>
  </defs>

  <!-- 墙 + 小肉垫墙纸 -->
  <rect width="1200" height="675" fill="url(#petWall)"/>
  <g fill="#FFFFFF" opacity="0.85">
    <g transform="translate(180 300) scale(0.6)">
      <ellipse cx="0" cy="10" rx="16" ry="13"/><circle cx="-18" cy="-8" r="7"/>
      <circle cx="-6" cy="-16" r="7"/><circle cx="6" cy="-16" r="7"/><circle cx="18" cy="-8" r="7"/>
    </g>
    <g transform="translate(620 190) scale(0.5)">
      <ellipse cx="0" cy="10" rx="16" ry="13"/><circle cx="-18" cy="-8" r="7"/>
      <circle cx="-6" cy="-16" r="7"/><circle cx="6" cy="-16" r="7"/><circle cx="18" cy="-8" r="7"/>
    </g>
    <g transform="translate(500 340) scale(0.45)">
      <ellipse cx="0" cy="10" rx="16" ry="13"/><circle cx="-18" cy="-8" r="7"/>
      <circle cx="-6" cy="-16" r="7"/><circle cx="6" cy="-16" r="7"/><circle cx="18" cy="-8" r="7"/>
    </g>
    <g transform="translate(1010 470) scale(0.5)">
      <ellipse cx="0" cy="10" rx="16" ry="13"/><circle cx="-18" cy="-8" r="7"/>
      <circle cx="-6" cy="-16" r="7"/><circle cx="6" cy="-16" r="7"/><circle cx="18" cy="-8" r="7"/>
    </g>
  </g>

  <!-- 窗户（外面是草地和鸟） -->
  <rect x="110" y="140" width="290" height="210" rx="24" fill="url(#petSky)" stroke="#6B4A45" stroke-width="10"/>
  <path d="M255 140 V350 M110 245 H400" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round"/>
  <g fill="#A8E6CF">
    <ellipse cx="180" cy="330" rx="120" ry="60"/>
    <ellipse cx="340" cy="345" rx="140" ry="60"/>
  </g>
  <circle cx="340" cy="196" r="24" fill="#FFE066" stroke="#F7B733" stroke-width="5"/>
  <g stroke="#6B4A45" stroke-width="6" fill="#FFB3C6" stroke-linejoin="round">
    <path d="M160 210 q16 -14 32 0 q-16 14 -32 0 Z"/>
    <path d="M196 186 q14 -12 28 0 q-14 12 -28 0 Z"/>
  </g>

  <!-- 右上：玩具架 -->
  <g stroke="#6B4A45" stroke-width="7" stroke-linejoin="round">
    <rect x="760" y="196" width="330" height="18" rx="9" fill="#E7B183"/>
    <circle cx="812" cy="162" r="30" fill="#FFD166"/>
    <path d="M782 162 q30 -22 60 0 M782 162 q30 22 60 0" fill="none" stroke-width="6"/>
    <rect x="866" y="140" width="72" height="56" rx="14" fill="#FFB3C6"/>
    <rect x="860" y="128" width="84" height="16" rx="8" fill="#FF8FAB"/>
    <path d="M962 196 q0 -44 30 -44 q30 0 30 44 Z" fill="#A8E6CF"/>
    <path d="M962 170 h60" stroke-width="6"/>
  </g>

  <!-- 右：猫爬架 -->
  <g stroke="#6B4A45" stroke-width="8" stroke-linejoin="round">
    <ellipse cx="1060" cy="500" rx="86" ry="24" fill="#FFD9E6"/>
    <rect x="1032" y="300" width="56" height="200" fill="#F2C99A"/>
    <ellipse cx="1060" cy="300" rx="90" ry="26" fill="#FFB3C6"/>
    <circle cx="1060" cy="262" r="26" fill="#FFF6E5"/>
    <path d="M1050 262 h20 M1052 254 v16 M1068 254 v16" stroke-width="5"/>
  </g>

  <!-- 护墙板 / 地板 / 地毯 -->
  <rect x="0" y="518" width="1200" height="157" fill="#CDEBDD"/>
  <rect x="0" y="506" width="1200" height="20" rx="10" fill="#A8E6CF" stroke="#6B4A45" stroke-width="5"/>
  <rect x="0" y="616" width="1200" height="59" fill="url(#petFloor)"/>
  <ellipse cx="620" cy="612" rx="420" ry="46" fill="#FFB3C6" opacity="0.75"/>
  <ellipse cx="620" cy="612" rx="330" ry="32" fill="#FFD9E6" opacity="0.9"/>

  <!-- 三块小坐垫（宠物就坐在上面） -->
  <g stroke="#6B4A45" stroke-width="7" stroke-linejoin="round">
    <ellipse cx="420" cy="500" rx="96" ry="26" fill="#CDB4F6"/>
    <ellipse cx="640" cy="500" rx="96" ry="26" fill="#7FD8BE"/>
    <ellipse cx="860" cy="500" rx="96" ry="26" fill="#FFD166"/>
    <ellipse cx="420" cy="494" rx="76" ry="18" fill="#E4D6FF" stroke-width="0"/>
    <ellipse cx="640" cy="494" rx="76" ry="18" fill="#CFEEDF" stroke-width="0"/>
    <ellipse cx="860" cy="494" rx="76" ry="18" fill="#FFF3C4" stroke-width="0"/>
  </g>

  <!-- 食盆垫 -->
  <rect x="430" y="536" width="470" height="66" rx="30" fill="#FFF6E5" stroke="#6B4A45" stroke-width="7"/>
  <g fill="#FFD9E6">
    <circle cx="470" cy="594" r="7"/><circle cx="560" cy="594" r="7"/><circle cx="650" cy="594" r="7"/>
    <circle cx="740" cy="594" r="7"/><circle cx="830" cy="594" r="7"/>
  </g>
</svg>
