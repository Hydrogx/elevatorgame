<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 470" width="260" height="470">
  <!-- 小地图：整栋楼剖面（现在有 4 层），右侧是电梯井 -->
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFE7FA"/>
      <stop offset="1" stop-color="#DCCFF3"/>
    </linearGradient>
  </defs>
  <!-- 楼体 -->
  <rect x="6" y="34" width="248" height="424" rx="26" fill="#FFF6E5" stroke="#6B4A45" stroke-width="8"/>
  <!-- 屋顶 -->
  <path d="M6 46 q60 -40 124 -40 q64 0 124 40 Z" fill="#FFB3C6" stroke="#6B4A45" stroke-width="8" stroke-linejoin="round"/>
  <line x1="130" y1="6" x2="130" y2="-24" stroke="#6B4A45" stroke-width="6"/>
  <path d="M130 -24 l40 12 l-40 12 Z" fill="#FFD166" stroke="#6B4A45" stroke-width="6" stroke-linejoin="round"/>

  <!-- 四层房间：4F 52-151 / 3F 151-250 / 2F 250-349 / 1F 349-448 -->
  <rect x="18" y="52" width="158" height="99" rx="14" fill="#E4D6FF" stroke="#6B4A45" stroke-width="6"/>
  <rect x="18" y="151" width="158" height="99" rx="14" fill="#F6DCC0" stroke="#6B4A45" stroke-width="6"/>
  <rect x="18" y="250" width="158" height="99" rx="14" fill="#CFEEDF" stroke="#6B4A45" stroke-width="6"/>
  <rect x="18" y="349" width="158" height="99" rx="14" fill="#FFD9E6" stroke="#6B4A45" stroke-width="6"/>

  <!-- 楼层图标 -->
  <g transform="translate(95 101)">
    <path d="M0 -12 q0 -12 11 -12 q11 0 11 12" fill="none" stroke="#6B4A45" stroke-width="6" stroke-linecap="round"/>
    <path d="M-30 18 L0 -8 L30 18 Z" fill="#B79BF0" stroke="#6B4A45" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <g transform="translate(95 200)">
    <path d="M-26 -12 h52 v18 q0 26 -26 26 q-26 0 -26 -26 Z" fill="#FFF6E5" stroke="#6B4A45" stroke-width="6" stroke-linejoin="round"/>
    <path d="M-26 -12 h52 v8 h-52 Z" fill="#A9714B"/>
    <path d="M26 0 q18 2 14 16 q-4 12 -18 10" fill="none" stroke="#6B4A45" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g transform="translate(95 299)">
    <path d="M0 -30 q26 0 26 -14 q0 -14 -26 -14 q-26 0 -26 14 q0 14 26 14 Z" fill="#7FD8BE" stroke="#6B4A45" stroke-width="6"/>
    <path d="M-26 0 l26 34 l26 -34 Z" fill="#F2B880" stroke="#6B4A45" stroke-width="6" stroke-linejoin="round"/>
  </g>
  <g transform="translate(95 398)">
    <circle cx="0" cy="-10" r="22" fill="#FF8FAB" stroke="#6B4A45" stroke-width="6"/>
    <circle cx="0" cy="-10" r="9" fill="#FFFFFF" opacity="0.85"/>
    <rect x="-15" y="12" width="30" height="24" rx="12" fill="#FF8FAB" stroke="#6B4A45" stroke-width="6"/>
  </g>

  <!-- 电梯井 -->
  <rect x="186" y="52" width="62" height="396" rx="16" fill="url(#shaft)" stroke="#6B4A45" stroke-width="8"/>
  <g stroke="#6B4A45" stroke-width="5" opacity="0.35">
    <line x1="190" y1="151" x2="244" y2="151"/>
    <line x1="190" y1="250" x2="244" y2="250"/>
    <line x1="190" y1="349" x2="244" y2="349"/>
  </g>
  <!-- 大门口 -->
  <rect x="84" y="420" width="30" height="38" rx="10" fill="#FFF6E5" stroke="#6B4A45" stroke-width="6"/>
</svg>
