<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 470" width="260" height="470">
  <!-- 小地图：整栋楼剖面（5 层），右侧是电梯井 -->
  <defs>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#EFE7FA"/>
      <stop offset="1" stop-color="#DCCFF3"/>
    </linearGradient>
  </defs>
  <!-- 楼体 -->
  <rect x="6" y="34" width="248" height="424" rx="26" fill="#FFF6E5" stroke="#6B4A45" stroke-width="8"/>
  <!-- 屋顶 -->
  <path d="M6 46 q60 -40 124 -40 q64 0 124 40 Z" fill="#FFB3C6" stroke="#6B4A45" stroke-width="8" stroke-linejoin="round"/>
  <line x1="130" y1="6" x2="130" y2="-24" stroke="#6B4A45" stroke-width="6"/>
  <path d="M130 -24 l40 12 l-40 12 Z" fill="#FFD166" stroke="#6B4A45" stroke-width="6" stroke-linejoin="round"/>

  <!-- 五层房间：每层 79 高，从 y=52 起 -->
  <rect x="18" y="52"  width="158" height="79" rx="12" fill="#D6F0FF" stroke="#6B4A45" stroke-width="5"/>
  <rect x="18" y="131" width="158" height="79" rx="12" fill="#E4D6FF" stroke="#6B4A45" stroke-width="5"/>
  <rect x="18" y="210" width="158" height="79" rx="12" fill="#F6DCC0" stroke="#6B4A45" stroke-width="5"/>
  <rect x="18" y="289" width="158" height="79" rx="12" fill="#CFEEDF" stroke="#6B4A45" stroke-width="5"/>
  <rect x="18" y="368" width="158" height="80" rx="12" fill="#FFD9E6" stroke="#6B4A45" stroke-width="5"/>

  <!-- 楼层图标 -->
  <g transform="translate(95 92)" fill="#7FC8F0" stroke="#6B4A45" stroke-width="4" stroke-linejoin="round">
    <ellipse cx="0" cy="8" rx="15" ry="11"/>
    <circle cx="-16" cy="-8" r="6"/><circle cx="-5" cy="-15" r="6"/>
    <circle cx="5" cy="-15" r="6"/><circle cx="16" cy="-8" r="6"/>
  </g>
  <g transform="translate(95 171)">
    <path d="M-4 -14 q0 -8 8 -8 q8 0 8 8" fill="none" stroke="#6B4A45" stroke-width="5" stroke-linecap="round"/>
    <path d="M-24 12 L0 -10 L24 12 Z" fill="#B79BF0" stroke="#6B4A45" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(95 250)">
    <path d="M-20 -12 h40 v14 q0 20 -20 20 q-20 0 -20 -20 Z" fill="#FFF6E5" stroke="#6B4A45" stroke-width="5" stroke-linejoin="round"/>
    <path d="M-20 -12 h40 v7 h-40 Z" fill="#A9714B"/>
    <path d="M20 0 q14 2 11 12 q-3 9 -14 8" fill="none" stroke="#6B4A45" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g transform="translate(95 329)">
    <path d="M0 -24 q20 0 20 -11 q0 -11 -20 -11 q-20 0 -20 11 q0 11 20 11 Z" fill="#7FD8BE" stroke="#6B4A45" stroke-width="5"/>
    <path d="M-20 0 l20 26 l20 -26 Z" fill="#F2B880" stroke="#6B4A45" stroke-width="5" stroke-linejoin="round"/>
  </g>
  <g transform="translate(95 408)">
    <circle cx="0" cy="-8" r="17" fill="#FF8FAB" stroke="#6B4A45" stroke-width="5"/>
    <circle cx="0" cy="-8" r="7" fill="#FFFFFF" opacity="0.85"/>
    <rect x="-12" y="10" width="24" height="19" rx="9" fill="#FF8FAB" stroke="#6B4A45" stroke-width="5"/>
  </g>

  <!-- 电梯井 -->
  <rect x="186" y="52" width="62" height="396" rx="16" fill="url(#shaft)" stroke="#6B4A45" stroke-width="8"/>
  <g stroke="#6B4A45" stroke-width="4" opacity="0.32">
    <line x1="190" y1="131" x2="244" y2="131"/>
    <line x1="190" y1="210" x2="244" y2="210"/>
    <line x1="190" y1="289" x2="244" y2="289"/>
    <line x1="190" y1="368" x2="244" y2="368"/>
  </g>
  <!-- 大门口 -->
  <rect x="84" y="424" width="30" height="34" rx="10" fill="#FFF6E5" stroke="#6B4A45" stroke-width="5"/>
</svg>
